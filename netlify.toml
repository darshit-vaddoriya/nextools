[build]
  publish = "dist"
  command = "npm run build"

# Astro 7 needs Node 22.12 or newer.
[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# The service worker must never be served from HTTP cache, or a deploy would
# not reach installed apps until that cache expired.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=3600"

# Astro (Vite) content-hashes everything under /assets, so these can be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Blog topics merged on 2026-09-29 (nine became five). Old hub URLs point to
# the topic their guides moved into, so existing links keep working.
[[redirects]]
  from = "/blog/topic/docs"
  to = "/blog/topic/pdf"
  status = 301

[[redirects]]
  from = "/blog/topic/media"
