<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0d16"/>
      <stop offset="1" stop-color="#151522"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.7">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <g transform="translate(96, 265)">
    <rect x="0" y="-8" width="120" height="120" rx="24" fill="url(#brand)"/>
    <text x="60" y="84" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="900"
          fill="#ffffff" text-anchor="middle" letter-spacing="-1">DK</text>

    <text x="160" y="64" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700"
          fill="#ffffff" letter-spacing="-2">Next</text>
    <text x="424" y="64" font-family="Arial, Helvetica, sans-serif" font-size="66" font-weight="700"
          fill="#8b9bff" letter-spacing="-2">Tool</text>
  </g>

  <text x="96" y="440" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="400"
