  <rect x="96" y="486" width="240" height="44" rx="22" fill="#ffffff" opacity="0.08"/>
  <text x="216" y="516" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="600"
        fill="#e4e4e7" text-anchor="middle">No uploads · No account</text>
