<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-M60L9W8G3B"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-M60L9W8G3B');
    </script>

    <script>
      (function () {
        try {
          // Light is the default regardless of OS preference; dark only
          // applies once the visitor picks it explicitly.
          var t = localStorage.getItem('nexttool-theme');
          if (t === 'dark') document.documentElement.classList.add('dark');
        } catch (e) {}
      })();
    </script>

    <!-- ── Favicon ───────────────────────────────────────── -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- ── Primary SEO ───────────────────────────────────── -->
    <title>NextTool - Free Online Tools</title>
    <meta name="description" content="Free browser tools for PDF, image, developer and AI tasks. Files are processed on your own device, so nothing is uploaded." />
    <meta name="keywords" content="free online tools, PDF merge, PDF compress, image compressor, background remover, video trimmer, JSON formatter, password generator, base64 encoder, UUID generator, free browser tools, client-side tools" />
    <meta name="author" content="NextTool" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="google-adsense-account" content="ca-pub-3383457039703768" />
    <link rel="canonical" href="https://nexttool.click/" />

    <!-- ── Google AdSense loader — needed for site review and for serving ── -->
    <script async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3383457039703768"
      crossorigin="anonymous"></script>

    <!-- ── Open Graph ─────────────────────────────────────── -->
    <meta property="og:type"        content="website" />
    <meta property="og:site_name"   content="NextTool" />
    <meta property="og:url"         content="https://nexttool.click/" />
    <meta property="og:title"       content="NextTool - Free Online Tools" />
    <meta property="og:description" content="Free PDF, image, video, developer and AI tools that run right in your browser. No uploads, no account, no cost." />
    <meta property="og:image"       content="https://nexttool.click/og-image.png" />
    <meta property="og:image:width"  content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale"      content="en_US" />

    <!-- ── Twitter Card ──────────────────────────────────── -->
    <meta name="twitter:card"        content="summary_large_image" />
    <meta name="twitter:site"        content="@nexttool" />
    <meta name="twitter:title"       content="NextTool - Free Online Tools" />
    <meta name="twitter:description" content="Free PDF, image, video, AI and developer tools that run in your browser. No uploads or logins needed." />
    <meta name="twitter:image"       content="https://nexttool.click/og-image.png" />

    <!-- ── Structured Data — WebSite + SearchAction ──────── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "NextTool",
      "url": "https://nexttool.click/",
      "description": "Free browser-based tools for PDF, image, video, developer and AI tasks that run on your device.",
      "author": {
        "@type": "Organization",
        "name": "NextTool"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://nexttool.click/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- ── Structured Data — Organization (publisher identity) ── -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "NextTool",
      "url": "https://nexttool.click/",
      "logo": "https://nexttool.click/favicon-512.png",
      "description": "Independent publisher of free, privacy-first browser tools for PDF, image, developer and AI tasks.",
      "email": "dk.coder7250@gmail.com",
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer support",
        "email": "dk.coder7250@gmail.com",
        "url": "https://nexttool.click/contact",
        "availableLanguage": ["en"]
      },
      "sameAs": [
        "https://www.instagram.com/dkcoder8/",
        "https://www.youtube.com/@dkcoder"
      ]
    }
    </script>

    <!--
      SoftwareApplication and FAQPage are intentionally NOT declared here.
      Anything in this file is served on all ~185 routes, which would make
      /privacy claim to be an app and answer the homepage's FAQs — a
      schema/content mismatch. Both are injected for the homepage only,
      by updateHomeMeta() in src/utils/seo.ts.
    -->

    <!-- ── Fonts ──────────────────────────────────────────── -->
    <!-- Self-hosted via @fontsource (see src/main.tsx) — koi external CDN request nahi -->

    <!-- ── Theme color ────────────────────────────────────── -->
    <meta name="theme-color" content="#131313" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#faf9ff" media="(prefers-color-scheme: light)" />
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
